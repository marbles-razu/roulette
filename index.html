<h1 class=sr-only>Lucky Marbles</h1>
<div id=settings class=settings>
  <div class=right>
    <button id=btnToggleSettings class=btn-toggle-settings>
      <span data-trans>Settings</span>
      <i class=toggle-arrow>▲</i>
    </button>
    <div class="collapsed collapsible-rows">
      <div class=row>
        <label for=sltMap>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <div class=map-picker>
          <select id=sltMap></select>
          <button id=btnRemoveMap class=btn-map-action type=button hidden title="Remove this map" data-trans=title>✕</button>
          <a id=lnkMoreMaps class=btn-map-action href=https://marblerouletteshop.com/maps target=_blank rel=noopener title="Get more maps" data-trans=title>+</a>
        </div>
      </div>
      <div class="row row-toggles">
        <div class=toggle-item>
          <label for=chkAutoRecording>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type=checkbox id=chkAutoRecording>
        </div>
        <div class=toggle-item>
          <label for=chkSkill>
            <i class="bomb icon"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type=checkbox id=chkSkill checked>
        </div>
      </div>
      <div class=row>
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class=btn-group>
          <button class="btn-first-winner btn-winner" data-trans>First</button>
          <button class="active btn-last-winner btn-winner" data-trans>Last</button>
          <input type=number id=in_winningRank value=1 min=1>
          <button class="btn-multi-winner btn-winner" data-trans>Multiple</button>
        </div>
      </div>
      <div class="row row-range">
        <label></label>
        <div class="btn-group range-group">
          <input type=number id=in_rangeStart value=1 min=1>
          <span class=range-sep>~</span>
          <input type=number id=in_rangeEnd value=3 min=1>
        </div>
      </div>
      <div class="row row-theme">
        <div class=theme>
          <i class="icon sun"></i>
          <input type=checkbox id=chkDarkMode checked>
          <i class="icon moon"></i>
        </div>
      </div>
    </div>
  </div>
  <div class=left>
    <h3 data-trans>Enter names below</h3>
    <textarea id=in_names placeholder="Input names separated by commas or line feed here" data-trans=placeholder>수박*2,키위*2,귤*2</textarea>
    <div class=actions>
      <button id=btnNotice style=display:none>
        <i class="icon megaphone"></i>
      </button>
      <a href=https://marblerouletteshop.com target=_blank id=btnShop class=btn title=Shop style=display:none>
        <i class="icon shop"></i>
        <span>Shop</span>
      </a>
      <div class=sep></div>
      <button id=btnShuffle>
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id=btnStart>
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<div id=notice>
  <h2>Notice</h2>
  <div class=notice-body>
    <h3>맵 공유마당이 열렸습니다</h3>
    <p>
      직접 만든 맵을 올리고, 다른 사람이 만든 맵을 받아 마블 룰렛에서 플레이할 수 있습니다.<br>
      맵은 웹 맵 에디터로 누구나 만들 수 있고, 심사를 거쳐 공개됩니다.
      받은 맵은 맵 목록의 "다운로드한 맵"에서 고르면 됩니다.<br>
      <a href=https://marblerouletteshop.com/maps target=_blank>맵 공유마당 둘러보기</a> ·
      <a href=https://marblerouletteshop.com/map-editor target=_blank>맵 만들기</a>
    </p>
  </div>
  <div class=notice-action>
    <button id=closeNotice data-trans>Close</button>
  </div>
</div>
<div class=copyright id=credit>Based on Marble Roulette by <a href=https://github.com/lazygyu/roulette target=_blank>lazygyu</a> (MIT License)
</div>

<div id=heroPanel style="z-index:1000;color:#fff;white-space:nowrap;background:#222;border:1px solid #666;border-radius:10px;align-items:center;gap:8px;padding:10px 12px;font-size:14px;display:none;position:fixed;bottom:44px;left:50%;transform:translate(-50%)">
  <label for=heroInput>주인공</label>
  <input id=heroInput placeholder="비우면 공정하게" style="color:#fff;background:#111;border:1px solid #888;border-radius:6px;width:9em;padding:6px 8px;font-size:14px">
  <button id=heroSave type=button style="color:#222;cursor:pointer;background:#ffb84d;border:0;border-radius:6px;padding:6px 10px;font-size:14px">저장</button>
</div>
